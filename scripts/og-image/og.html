<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Archivo";
    font-weight: 100 900;
    src: url("../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 500;
    src: url("../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-weight: 600;
    src: url("../../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2") format("woff2");
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #fff; color: #0f1419; }
  .stage { position: relative; width: 1200px; height: 630px; }
  .panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 520px;
    background: #e9edf0; border-left: 1px solid #d3d9df;
  }
  .card {
    position: absolute; border: 1px solid #d3d9df; background: #fff; overflow: hidden;
  }
  .card img { display: block; width: 100%; height: auto; }
  .card.reddit { left: 712px; top: 44px; width: 360px; height: 600px; }
  .card.x { left: 860px; top: 300px; width: 300px; border-color: #0f1419; }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .brand { position: absolute; left: 72px; top: 50px; display: flex; align-items: center; gap: 12px; font: 800 30px/1 "Archivo"; letter-spacing: -0.02em; }
  .brand svg { width: 42px; height: 42px; }
  h1 { font: 800 76px/1.02 "Archivo"; letter-spacing: -0.025em; text-wrap: pretty; }
  h1 em { font-style: normal; color: #bf3b0f; }
  p { margin-top: 28px; font: 500 28px/1.4 "IBM Plex Sans"; color: #3a444d; max-width: 500px; }
  .tag { position: absolute; left: 72px; bottom: 52px; display: flex; gap: 12px; font: 600 21px/1 "IBM Plex Sans"; }
  .tag span { border: 1px solid #0f1419; border-radius: 6px; padding: 11px 16px; }
  .tag span.accent { background: #bf3b0f; border-color: #bf3b0f; color: #fff; }
</style>
</head>
<body>
<div class="stage">
  <div class="panel"></div>
  <div class="card reddit"><img src="sample.png" alt="" /></div>
  <div class="card x"><img src="sample-x.png" alt="" /></div>
  <div class="brand"><svg viewBox="0 0 256 256" aria-hidden="true"><g><path fill="#0f1419" d="M32 104V80A56 56 0 0 1 88 24H112V48H88A32 32 0 0 0 56 80V104Z M144 24H168A56 56 0 0 1 224 80V104H200V80A32 32 0 0 0 168 48H144Z M224 136V160A56 56 0 0 1 168 216H144V192H168A32 32 0 0 0 200 160V136Z M32 136H56V192H112V216H56L32 240Z"/><path fill="#bf3b0f" d="M92 84H164A12 12 0 0 1 164 108H92A12 12 0 0 1 92 84Z M92 132H132A12 12 0 0 1 132 156H92A12 12 0 0 1 92 132Z"/></g></svg>threadshot.app</div>
  <div class="copy">
    <h1>Reddit and X, as <em>clean images</em></h1>
    <p>Download any thread or post as a phone-sized PNG.</p>
  </div>
  <div class="tag"><span class="accent">Free</span><span>No account</span><span>Hide usernames</span></div>
</div>
</body>
</html>
